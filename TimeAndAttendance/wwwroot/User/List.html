<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Table</title>
    <link rel="stylesheet" href="../Style.css">
</head>
<body>
    <div class="container">
        <h1>User List</h1>
        <div class="actions">
            <a href="Create.html" class="button">New</a>
            <a href="../Home.html" class="button back-btn">Back</a>
        </div>
        <div class="filter-container">
            <button id="clearAllFilter" class="clear-all-filter-btn">Clear</button>
            <select id="nameFilter" class="dropdown">
                <option value="">All Names</option>
            </select>
            <select id="dateFilter" class="dropdown">
                <option value="">All Dates</option>
            </select>
            <div class="checkbox-container">
                <input type="checkbox" id="includeDeleted" name="includeDeleted" checked="checked">
                <label for="includeDeleted">Include Deleted</label>
            </div>
            <div class="tableSummary">
                <a><span id="filteredItemsCount">0</span></a>
                /
                <a><span id="totalItemsCount">0</span></a>
            </div>
        </div>
        <table id="userTable">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Joining Date</th>
                    <th>Resignation Date</th>
                    <th>Deleted Date</th>
                    <th>Origin Id</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be dynamically populated -->
            </tbody>
        </table>
        <div class="actions-btm">
            <button id="hardDeleteAllBtn" class="button hard-delete-all-btn">Hard Delete All</button>
        </div>
    </div>
    <script src="List.js"></script>
</body>
</html>
